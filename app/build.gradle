
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

ext {
    //是否是高德签名，高德key权限比较全，有时无法测试权限问题。
    isGaode = true
}

android {

    namespace 'com.nrmyw.gaode_t'
    compileSdk 33
    defaultConfig {
        applicationId 'com.nrmyw.gaode_t'
        manifestPlaceholders = [
                "APP_NAME":"黎潇-地图",
                "GD_KEY":"e4a740e45b8e056471b9f356b55b8fb5"]
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 33
        versionCode 1
        versionName "1.0.30"
        multiDexEnabled true

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    lintOptions {
        abortOnError false
    }

    signingConfigs {
        release {
            storeFile file('../keystore/lixiao_public_app.jks')
            keyPassword 'lixiao'
            keyAlias 'lixiao123'
            storePassword 'lixiao'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }



    buildTypes {

        debug {

            minifyEnabled false
            signingConfig signingConfigs.release
            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "hud_ar-${variant.name}-${variant.versionName}.apk"
                }
            }
        }

        release {
            //是否zip对齐
            //zipAlignEnabled true
            // 移除无用的resource文件
            //shrinkResources true
            //添加混淆

            minifyEnabled false
            //签名配置
            signingConfig signingConfigs.release

            android.applicationVariants.all { variant ->
                variant.outputs.all {

                    outputFileName = "hud_ar-${variant.name}-${variant.versionName}.apk"
                }
            }
        }

        hn_version {
            //是否zip对齐
            //zipAlignEnabled true
            // 移除无用的resource文件
            //shrinkResources true
            //添加混淆

            minifyEnabled false
            //签名配置
            signingConfig signingConfigs.release

            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "hud_hn_ar-${variant.name}-${variant.versionName}.apk"
                }
            }

        }

        dengpeng_version {
            //是否zip对齐
            //zipAlignEnabled true
            // 移除无用的resource文件
            //shrinkResources true
            //添加混淆
            minifyEnabled false
            //签名配置
            signingConfig signingConfigs.release

            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "hud_ar-${variant.name}-${variant.versionName}.apk"
                }
            }

        }


 
    }



//    splits {
//        abi {
//            enable true
//            reset()
//            include 'armeabi-v7a', 'arm64-v8a'
//        }
//    }
    sourceSets {
        main{
            jniLibs.srcDirs = ['libs'];
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

}



