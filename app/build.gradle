apply plugin: 'com.android.application'

ext {
    //是否是高德签名，高德key权限比较全，有时无法测试权限问题。
    isGaode = true
}

android {
    namespace 'com.nrmyw.gaode_t'
    compileSdk 31
    defaultConfig {
        applicationId 'com.nrmyw.gaode_t'
        manifestPlaceholders = [
                "APP_NAME":"黎潇-地图",
                "GD_KEY":"e4a740e45b8e056471b9f356b55b8fb5"]

        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        signingConfig signingConfigs.debug

    }

    signingConfigs {


        release {
            storeFile file('../keystore/lixiao_public_app.jks')
            keyPassword 'lixiao'
            keyAlias 'lixiao123'
            storePassword 'lixiao'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {

        debug {
            minifyEnabled false
            signingConfig signingConfigs.release

        }

        release {
            //是否zip对齐
            //zipAlignEnabled true
            // 移除无用的resource文件
            //shrinkResources true
            //添加混淆
            minifyEnabled false
            //签名配置
            signingConfig signingConfigs.release


        }
    }

//    splits {
//        abi {
//            enable true
//            reset()
//            include 'armeabi-v7a', 'arm64-v8a'
//        }
//    }
    sourceSets {
        main{
            jniLibs.srcDirs = ['libs'];
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.0-alpha1'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.github.lixiao-nb666:build_lib:1.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.github.lixiao-nb666:welcome_activity_lib:1.0.0'
    implementation 'com.github.lixiao-nb666:ble_lib:1.0.28'
    implementation 'com.github.lixiao-nb666:ble_event:1.0.8'
    implementation 'com.github.lixiao-nb666:hud_data_lib:1.0.15'
    implementation 'com.github.lixiao-nb666:hud_event_lib:1.0.33'
    implementation 'com.github.lixiao-nb666:hud_manager_lib:1.0.7'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
//    implementation fileTree(include: ['*.jar'], dir: 'libs')
//    implementation 'com.amap.api:navi-3dmap:9.8.2_3dmap9.8.2'
//    implementation 'com.amap.api:search:9.7.0'

//    implementation 'com.amap.api:search:latest.integration'
//    implementation 'com.amap.api:navi-3dmap:latest.integration'
//    implementation group: 'com.amap.api', name: 'navi-3dmap-location-search', version: '10.1.201_3dmap10.1.201_loc6.4.9_sea9.7.4'

    implementation 'com.amap.api:navi-3dmap-location-search:10.1.201_3dmap10.1.201_loc6.4.9_sea9.7.4'
    implementation 'com.belerweb:pinyin4j:2.5.0'
    implementation files('libs\\Msc.jar')
    //implementation 'com.tmapmobility.tmap:tmap-edc-sdk:1.0.0.0039'
    implementation 'com.github.lixiao-nb666:float_window_lib:1.0'
}
